name: Build CV

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc texlive-latex-base texlive-latex-recommended

      - name: Build PDF and HTML
        run: make

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cv-build
          path: |
            cv.pdf
            cv.html
